<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NSRU Lab Setup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #060913;
      --card-bg: rgba(13, 20, 38, 0.72);
      --card-border: rgba(99, 140, 255, 0.18);
      --primary: #38bdf8;
      --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #6366f1 50%, #a855f7 100%);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-sub: #64748b;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    #canvas3d {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 10;
      max-width: 500px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Glass Card */
    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 36px 32px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7),
                  0 0 40px 0 rgba(56, 189, 248, 0.08);
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .glass-card:hover {
      border-color: rgba(99, 140, 255, 0.32);
      box-shadow: 0 30px 70px -15px rgba(0, 0, 0, 0.8),
                  0 0 50px 0 rgba(56, 189, 248, 0.15);
    }

    /* Badges */
    .badge-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
    }

    .pill-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px 12px;
      border-radius: 9999px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.28);
      color: var(--primary);
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* Title */
    h1 {
      font-size: 30px;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 28px;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    /* Actions */
    .action-section {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Download Button */
    .btn-download {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 20px;
      background: var(--accent-gradient);
      color: #ffffff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 700;
      border-radius: 14px;
      box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4);
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
    }

    .btn-download:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 35px -5px rgba(99, 102, 241, 0.6);
      filter: brightness(1.1);
    }

    .btn-download:active {
      transform: translateY(0);
    }

    .divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
      margin: 4px 0;
    }

    .section-label {
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Command Box */
    .cmd-wrapper {
      position: relative;
      background: rgba(6, 11, 25, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .cmd-wrapper:hover {
      border-color: var(--primary);
      background: rgba(10, 18, 38, 0.95);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
    }

    .cmd-code {
      font-family: 'JetBrains Mono', Consolas, monospace;
      font-size: 13px;
      color: #38bdf8;
      word-break: break-all;
      user-select: all;
    }

    .copy-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #f1f5f9;
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }

    .copy-btn:hover {
      background: var(--primary);
      color: #060913;
      border-color: var(--primary);
    }

    .copy-btn.copied {
      background: var(--success);
      color: #ffffff;
      border-color: var(--success);
    }

    /* Footer */
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px;
      font-size: 12px;
      color: var(--text-sub);
    }

    .footer a {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .footer a:hover {
      color: var(--primary);
    }

    @media (max-width: 640px) {
      .glass-card {
        padding: 28px 20px;
      }
      h1 {
        font-size: 24px;
      }
      .footer {
        flex-direction: column;
        gap: 8px;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <!-- 3D Canvas -->
  <canvas id="canvas3d"></canvas>

  <div class="container">
    <div class="glass-card">
      <div class="badge-wrap">
        <div class="pill-badge">
          <span class="pulse-dot"></span>
          <span>v1.1</span>
        </div>
        <div class="pill-badge" style="border-color: rgba(99, 102, 241, 0.3); color: #818cf8; background: rgba(99, 102, 241, 0.1);">
          Windows 11
        </div>
      </div>

      <h1>🖥️ NSRU Lab Setup</h1>

      <div class="action-section">
        <a href="setup.bat" download="setup.bat" class="btn-download">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          <span>setup.bat</span>
        </a>

        <div class="divider"></div>

        <div class="section-label">PowerShell (Admin)</div>

        <div class="cmd-wrapper" id="cmdBox" onclick="copyCommand()">
          <span class="cmd-code" id="cmdText">irm x66clrf.github.io/lab-setup/go.txt | iex</span>
          <button class="copy-btn" id="copyBtn" type="button" aria-label="Copy Command">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <span id="copyBtnText">Copy</span>
          </button>
        </div>
      </div>
    </div>

    <div class="footer">
      <div>NSRU ARITC</div>
      <div>
        <a href="https://github.com/X66CLRF/lab-setup" target="_blank" rel="noopener noreferrer">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
          </svg>
          <span>GitHub</span>
        </a>
      </div>
    </div>
  </div>

  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    function copyCommand() {
      const text = document.getElementById('cmdText').innerText;
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById('copyBtn');
        const btnText = document.getElementById('copyBtnText');
        btn.classList.add('copied');
        btnText.innerText = 'Copied';
        setTimeout(() => {
          btn.classList.remove('copied');
          btnText.innerText = 'Copy';
        }, 2000);
      });
    }

    // --- Interactive Three.js 3D Background ---
    (function initThreeBackground() {
      const canvas = document.getElementById('canvas3d');
      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 80;

      const particleCount = 180;
      const positions = new Float32Array(particleCount * 3);
      const velocities = [];
      const spread = 120;

      for (let i = 0; i < particleCount; i++) {
        positions[i * 3]     = (Math.random() - 0.5) * spread * 1.5;
        positions[i * 3 + 1] = (Math.random() - 0.5) * spread;
        positions[i * 3 + 2] = (Math.random() - 0.5) * 60;

        velocities.push({
          x: (Math.random() - 0.5) * 0.07,
          y: (Math.random() - 0.5) * 0.07,
          z: (Math.random() - 0.5) * 0.04
        });
      }

      const particleGeo = new THREE.BufferGeometry();
      particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

      const particleMat = new THREE.PointsMaterial({
        color: 0x38bdf8,
        size: 2.2,
        transparent: true,
        opacity: 0.8,
        blending: THREE.AdditiveBlending
      });

      const particleSystem = new THREE.Points(particleGeo, particleMat);
      scene.add(particleSystem);

      const lineMaterial = new THREE.LineBasicMaterial({
        color: 0x6366f1,
        transparent: true,
        opacity: 0.18,
        blending: THREE.AdditiveBlending
      });

      const maxConnections = particleCount * 5;
      const linePositions = new Float32Array(maxConnections * 3 * 2);
      const lineGeo = new THREE.BufferGeometry();
      lineGeo.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));

      const lineSystem = new THREE.LineSegments(lineGeo, lineMaterial);
      scene.add(lineSystem);

      const torusGeo = new THREE.TorusGeometry(38, 0.35, 16, 100);
      const torusMat = new THREE.MeshBasicMaterial({
        color: 0x3b82f6,
        wireframe: true,
        transparent: true,
        opacity: 0.12
      });
      const torus = new THREE.Mesh(torusGeo, torusMat);
      torus.position.set(0, 0, -20);
      torus.rotation.x = Math.PI / 3;
      scene.add(torus);

      let mouseX = 0;
      let mouseY = 0;
      let targetX = 0;
      let targetY = 0;

      window.addEventListener('mousemove', (e) => {
        mouseX = (e.clientX - window.innerWidth / 2) * 0.03;
        mouseY = (e.clientY - window.innerHeight / 2) * 0.03;
      });

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      let clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);

        const delta = clock.getDelta();
        const pos = particleGeo.attributes.position.array;

        targetX += (mouseX - targetX) * 0.04;
        targetY += (mouseY - targetY) * 0.04;
        camera.position.x = targetX;
        camera.position.y = -targetY;
        camera.lookAt(scene.position);

        torus.rotation.z += 0.002;
        torus.rotation.y += 0.0015;

        let lineIdx = 0;
        const connectionDist = 22;

        for (let i = 0; i < particleCount; i++) {
          pos[i * 3]     += velocities[i].x;
          pos[i * 3 + 1] += velocities[i].y;
          pos[i * 3 + 2] += velocities[i].z;

          const limitX = spread * 0.8;
          const limitY = spread * 0.55;
          if (pos[i * 3] < -limitX || pos[i * 3] > limitX) velocities[i].x *= -1;
          if (pos[i * 3 + 1] < -limitY || pos[i * 3 + 1] > limitY) velocities[i].y *= -1;
          if (pos[i * 3 + 2] < -30 || pos[i * 3 + 2] > 30) velocities[i].z *= -1;

          for (let j = i + 1; j < particleCount; j++) {
            const dx = pos[i * 3] - pos[j * 3];
            const dy = pos[i * 3 + 1] - pos[j * 3 + 1];
            const dz = pos[i * 3 + 2] - pos[j * 3 + 2];
            const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);

            if (dist < connectionDist && lineIdx < maxConnections * 6) {
              linePositions[lineIdx++] = pos[i * 3];
              linePositions[lineIdx++] = pos[i * 3 + 1];
              linePositions[lineIdx++] = pos[i * 3 + 2];

              linePositions[lineIdx++] = pos[j * 3];
              linePositions[lineIdx++] = pos[j * 3 + 1];
              linePositions[lineIdx++] = pos[j * 3 + 2];
            }
          }
        }

        particleGeo.attributes.position.needsUpdate = true;
        lineGeo.setDrawRange(0, lineIdx / 3);
        lineGeo.attributes.position.needsUpdate = true;

        renderer.render(scene, camera);
      }

      animate();
    })();
  </script>
</body>
</html>
